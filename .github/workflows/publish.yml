# 手动发布到 npm（workflow_dispatch）。
#
# 设计约束（2026-08-24 定稿）：
# - 只允许手动触发，绝不监听 tag/push——tag 误打可删，npm 包撤不回，发版必须是人按下的。
# - 强制确认输入（输入 publish 才跑），防误点。
# - 发布前校验 package.json 版本未在 npm 上存在（重复版本 npm 会 403，提前失败更友好）。
#
# 前置：仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN
# （npmjs.com → Access Tokens → Granular Access Token，勾 bypass 2FA，权限限本包 read+write）。

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 OK 确认发布"
        required: true
        default: ""

jobs:
  publish:
    # OK/ok/Ok/oK 均可确认（误点防护，不分大小写）
    if: contains(fromJSON('["OK","ok","Ok","oK"]'), github.event.inputs.confirm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: 校验版本未发布过
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-token-monitor@$VERSION" version 2>/dev/null; then
            echo "::error::版本 $VERSION 已在 npm 上存在，请先升级 package.json 的 version（如 1.0.2 → 1.0.3）"
            exit 1
          fi
          echo "准备发布 $VERSION"

      - name: npm publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
