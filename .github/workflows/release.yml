# 推 tag 自动建 GitHub Release。
#
# 设计约束（与 publish.yml 配套，2026-09-28 定稿）：
# - GitHub Release 可删可改，所以允许监听 tag 推送自动创建；
#   npm 发布不可撤回，仍只能走 publish.yml 手动触发（输入 OK），两者独立。
# - 正文**固定一句默认**（"发布 vX.Y.Z。"）当占位：发完在网页上人工替换即可。
#   刻意不读任何日志文件、也不用 --generate-notes（那会生成一堆 What's Changed 噪音）。
# - **幂等且不破坏人工内容**：Release 已存在时只维护 latest 标记，不改标题与正文。
#   早期写法在"重新推送同名 tag"（修正 tag 指向）时会把已写好的正文覆盖成占位句，
#   2026-11-13 真实发生过一次，故改为绝不覆盖。
# - 手动触发（填 tag 名）用于给历史 tag 补建 Release。
# - 一致性守卫：tag 必须与 package.json 的 version 一致，不一致直接失败。

name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要为哪个 tag 建 Release（如 v1.0.11）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 默认检出即可：只用来读 tag 与 package.json，日志文件不参与
      - uses: actions/checkout@v5

      - name: 解析 tag 并校验与 package.json 版本一致
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # 补齐 tag ref；**失败不算错**（手动触发时工作区是所选分支，tag 未必在本地，
          # 而且浅克隆里 refspec 收窄/已存在都可能让 fetch 返回非 0——旧写法因此整步失败）
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" || true
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            PKG_VERSION=$(git show "refs/tags/$TAG:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          else
            # 兜底：工作区就是该 tag 的检出（push 触发时）
            PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          fi
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$PKG_VERSION 不一致"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 创建或更新 Release（已存在时只维护 latest，绝不覆盖人工写好的正文）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在：正文/标题可能已被人工写好（甚至已发布过），这里只确保 latest 标记。
            # 曾经的写法会无条件 `--notes "发布 $TAG。" --title "$TAG"`，只要重新推送
            # 同名 tag（例如修正 tag 指向）就会把正文冲掉——2026-11-13 真实发生过一次。
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" --title "$TAG" --notes "发布 $TAG。" --latest
          fi
