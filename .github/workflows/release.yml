# 推 tag 自动建 GitHub Release。
#
# 设计约束（与 publish.yml 配套，2026-09-28 定稿）：
# - GitHub Release 可删可改，所以允许监听 tag 推送自动创建；
#   npm 发布不可撤回，仍只能走 publish.yml 手动触发（输入 OK），两者独立。
# - Release 正文来源优先级：
#     1) docs/releases/<tag>.md —— **先取 tag 内那版**（发版当时的日志），
#        没有再回退到**默认分支当前版本**（日志补写得比 tag 晚时也能生效）；
#     2) 两处都没有才用 GitHub 自动生成（提交列表）。
#     为什么需要回退：手写日志常常在打 tag 之后才补提交，只认 tag 内容会静默退化成自动生成。
# - 幂等：Release 已存在时不报错，改为更新标题/正文（gh release edit），重跑安全。
# - 手动触发（Actions 页面选此工作流，填 tag 名）用于给历史 tag 补建 Release。
# - 一致性守卫：tag 必须与 package.json 的 version 一致，不一致直接失败。

name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要为哪个 tag 建 Release（如 v1.0.11）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 默认检出（默认分支，浅克隆）；tag 单独取，避免"检出 tag 导致日志文件取不到"
      - uses: actions/checkout@v5

      - name: 取 tag 并校验与 package.json 版本一致
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          PKG_VERSION=$(git show "$TAG:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$PKG_VERSION 不一致"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=dsh-token-monitor-$TAG" >> "$GITHUB_OUTPUT"

      - name: 定位手写日志（tag 内优先 → 默认分支回退）
        id: notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="docs/releases/$TAG.md"
          OUT="$RUNNER_TEMP/notes.md"
          if git cat-file -e "$TAG:$NOTES" 2>/dev/null; then
            git show "$TAG:$NOTES" > "$OUT"
            echo "来源：tag $TAG 内 $NOTES"
          elif [ -f "$NOTES" ]; then
            cp "$NOTES" "$OUT"
            echo "来源：默认分支当前 $NOTES"
          else
            : > "$OUT"
            echo "来源：无手写日志（将用自动生成正文）"
          fi
          if [ -s "$OUT" ]; then
            echo "file=$OUT" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建或更新 Release（手写正文）
        if: steps.notes.outputs.file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NAME="${{ steps.meta.outputs.name }}"
          FILE="${{ steps.notes.outputs.file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$NAME" --notes-file "$FILE"
          else
            gh release create "$TAG" --title "$NAME" --notes-file "$FILE" --latest
          fi

      - name: 创建或更新 Release（自动生成正文）
        if: steps.notes.outputs.file == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NAME="${{ steps.meta.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$NAME"
          else
            gh release create "$TAG" --title "$NAME" --generate-notes --latest
          fi
