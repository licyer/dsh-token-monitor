# 推 tag 自动建 GitHub Release。
#
# 设计约束（与 publish.yml 配套，2026-09-28 定稿）：
# - GitHub Release 可删可改，所以允许监听 tag 推送自动创建；
#   npm 发布不可撤回，仍只能走 publish.yml 手动触发（输入 OK），两者独立。
# - 正文**固定一句默认**（"发布 vX.Y.Z。"）当占位：发完在网页上人工替换即可。
#   刻意不读任何日志文件、也不用 --generate-notes（那会生成一堆 What's Changed 噪音）。
# - 幂等：Release 已存在时改为更新（gh release edit），重跑安全。
# - 手动触发（填 tag 名）用于给历史 tag 补建 Release。
# - 一致性守卫：tag 必须与 package.json 的 version 一致，不一致直接失败。

name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要为哪个 tag 建 Release（如 v1.0.11）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 默认检出即可：只用来读 tag 与 package.json，日志文件不参与
      - uses: actions/checkout@v5

      - name: 解析 tag 并校验与 package.json 版本一致
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          PKG_VERSION=$(git show "$TAG:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$PKG_VERSION 不一致"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 创建或更新 Release（标题=tag，正文为一句默认，待人工替换）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "发布 $TAG。"
          else
            gh release create "$TAG" --title "$TAG" --notes "发布 $TAG。" --latest
          fi
